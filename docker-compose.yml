services:
  mysql:
    image: mysql:8.0
    container_name: veepower_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE_NAME:-veepower_db}
      MYSQL_USER: ${DATABASE_USER:-veepower}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-root}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: docker/backend/Dockerfile
    container_name: veepower_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DATABASE_ENGINE: django.db.backends.mysql
      DATABASE_NAME: ${DATABASE_NAME:-veepower_db}
      DATABASE_USER: ${DATABASE_USER:-veepower}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-root}
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      USE_SQLITE: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-dev-secret-key-veepower-change-in-prod}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,*}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: veepower_frontend
    restart: always
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
