services:
  mysql:
    image: mysql:8.0
    container_name: veepower_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE_NAME:-veepower_db}
      MYSQL_USER: ${DATABASE_USER:-veepower}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-root}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: docker/backend/Dockerfile
    container_name: veepower_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DATABASE_ENGINE: django.db.backends.mysql
      DATABASE_NAME: ${DATABASE_NAME:-veepower_db}
      DATABASE_USER: ${DATABASE_USER:-veepower}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-root}
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      USE_SQLITE: "False"
      RUN_MIGRATIONS: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-dev-secret-key-veepower-change-in-prod}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,*}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8000/auth/google/callback}
      GOOGLE_ADMIN_EMAILS: ${GOOGLE_ADMIN_EMAILS:-veepower.cbe@gmail.com,balaadhish.cbe@gmail.com}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-veepower.cbe@gmail.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Vee Power Electricals}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8000}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-true}
      EMAIL_ASYNC_DISPATCH: ${EMAIL_ASYNC_DISPATCH:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PAYMENT_HANDLE: ${RAZORPAY_PAYMENT_HANDLE:-https://razorpay.me/@veepowerelectricals}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: veepower_frontend
    restart: always
    command: npm run dev -- --host 0.0.0.0
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://backend:8000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
