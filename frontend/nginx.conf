# ==============================================================================
# VEE POWER ELECTRICALS — NGINX PRODUCTION CONFIGURATION
# Primary Canonical Domain: https://veepowerelectricals.com
# Secondary Domain 301 Redirect: www.veepowerelectricals.com -> veepowerelectricals.com
# ==============================================================================

# 1. 301 Permanent Redirect for secondary www domain to primary canonical domain
server {
    listen 80;
    listen [::]:80;
    server_name www.veepowerelectricals.com;
    return 301 https://veepowerelectricals.com$request_uri;
}

# 2. Main Production Virtual Host
server {
    listen 80;
    listen [::]:80;
    server_name veepowerelectricals.com localhost "";

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Allow up to 50MB uploads for large Excel files with embedded product images and catalog assets
    client_max_body_size 50M;

    # Canonical host enforcement (in case proxy passes Host: www.veepowerelectricals.com)
    if ($host = 'www.veepowerelectricals.com') {
        return 301 https://veepowerelectricals.com$request_uri;
    }

    # High-performance OS I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        application/vnd.api+json
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ==============================================================================
    # SEO & SEARCH ENGINE CRAWLER DIRECTIVES
    # ==============================================================================

    # Dynamic XML Sitemap generated from live MySQL product data
    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=3600, s-maxage=3600";
    }

    # Robots.txt file with crawler rules and sitemap reference
    location = /robots.txt {
        proxy_pass http://backend:8000/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400, s-maxage=86400";
    }

    # IndexNow verification key endpoint (e.g. /<api_key>.txt for Bing/Yandex verification)
    location ~* ^/[a-zA-Z0-9_-]+\.txt$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google Shopping & Merchant Center dynamic product feeds
    location ^~ /feeds/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=7200, s-maxage=7200";
    }

    # ==============================================================================
    # APPLICATION BACKEND REVERSE PROXY ENDPOINTS
    # ==============================================================================

    # Reverse proxy for backend API endpoints
    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Reverse proxy for Google OAuth and top-level auth routes outside /api/
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Reverse proxy for Django admin (at /django-admin/ to preserve /admin for React SPA)
    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media files served directly via shared Docker volume with backend proxy fallback
    location ^~ /media/ {
        alias /app/media/;
        try_files $uri @media_backend;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location @media_backend {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
    }

    # Reverse proxy for Django collected static assets (admin/rest_framework)
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for health check endpoint
    location /health/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================================================================
    # STATIC ASSET OPTIMIZATIONS & CACHING
    # ==============================================================================

    # Vite hashed bundle chunks - immutable 1-year browser and CDN cache
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache static frontend assets (icons, images, webp, fonts)
    location ~* \.(ico|css|js|gif|jpe?g|png|webp|avif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Ensure index.html is never cached so new bundle deployments load instantly
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # ==============================================================================
    # SEARCH BOT CRAWLER PRERENDERING & CLIENT-SIDE SPA ROUTING
    # ==============================================================================

    # Homepage crawler prerendering for search bots & social crawlers
    location = / {
        if ($http_user_agent ~* (googlebot|bingbot|yandex|baiduspider|twitterbot|facebookexternalhit|rogerbot|linkedinbot|embedly|quora|pinterest|slackbot|whatsapp|duckduckbot|applebot)) {
            rewrite ^ /_seo_crawler/ last;
        }
        try_files /index.html =404;
    }

    # Public SEO landing pages & product detail pages for search bots & social crawlers
    location ~* ^/(product|brands|categories|locations|guides|shop|about|contact|privacy-policy|terms-and-conditions|shipping-policy|return-policy)(/.*)?$ {
        if ($http_user_agent ~* (googlebot|bingbot|yandex|baiduspider|twitterbot|facebookexternalhit|rogerbot|linkedinbot|embedly|quora|pinterest|slackbot|whatsapp|duckduckbot|applebot)) {
            rewrite ^ /_seo_crawler$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Internal location for search crawler prerendering
    location ^~ /_seo_crawler/ {
        internal;
        rewrite ^/_seo_crawler(/.*)$ /seo/render/?path=$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default React SPA routing for human visitors
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
