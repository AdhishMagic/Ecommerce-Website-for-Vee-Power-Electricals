services:
  mysql:
    ports: []  # Private database configuration: no public database ports exposed in production

  backend:
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 60 config.wsgi:application
    environment:
      DJANGO_DEBUG: "False"
      USE_SQLITE: "False"
      DJANGO_SETTINGS_MODULE: "config.settings.production"
      SEED_DEMO_DATA: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-veepowerelectricals.com,www.veepowerelectricals.com,localhost,127.0.0.1,backend,*}
      EMAIL_TEST_MODE: ${EMAIL_TEST_MODE:-False}

  frontend:
    command: ["nginx", "-g", "daemon off;"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      target: production
    ports:
      - "${PROD_FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
