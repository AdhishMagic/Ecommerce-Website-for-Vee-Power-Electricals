services:
  mysql:
    ports: []  # Private database configuration: no public database ports exposed in production

  backend:
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 60 config.wsgi:application
    environment:
      DJANGO_DEBUG: "False"
      USE_SQLITE: "False"
      DJANGO_SETTINGS_MODULE: "config.settings.production"
      SEED_DEMO_DATA: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,*}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-${RAZORPAY_KEY_ID:-}}
    ports:
      - "${PROD_FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    volumes: []
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
