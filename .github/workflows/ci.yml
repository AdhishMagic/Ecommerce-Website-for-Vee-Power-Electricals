name: CI Quality Gate & Release Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend Tests & Django Checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: veepower_test_db
          MYSQL_USER: veepower
          MYSQL_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-validation-secret-key-do-not-use-in-production-minimum-50-chars"
      JWT_SECRET_KEY: "ci-jwt-validation-secret-key-do-not-use-in-production-minimum-50-chars"
      DATABASE_ENGINE: "django.db.backends.mysql"
      DATABASE_NAME: "veepower_test_db"
      DATABASE_USER: "veepower"
      DATABASE_PASSWORD: "root"
      DATABASE_HOST: "127.0.0.1"
      DATABASE_PORT: "3306"
      USE_SQLITE: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install System Dependencies for MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/production.txt

      - name: Run Django System Checks (Standard & Production Settings)
        run: |
          cd backend
          python manage.py check
          python manage.py check --settings=config.settings.production

      - name: Verify No Missing Database Migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Verify Static Asset Collection
        run: |
          cd backend
          python manage.py collectstatic --noinput --settings=config.settings.production

      - name: Run Full Backend Test Suite
        run: |
          cd backend
          python manage.py test

  frontend-validation:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_URL: "https://api.veepower.in/api/v1"
        run: npm run build

      - name: Validate Production Build Artifacts
        working-directory: ./frontend
        run: |
          test -f dist/index.html
          test -d dist/assets

  security-scan:
    name: Secret & Configuration Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan Working Tree for Accidental Secret Leaks
        run: |
          echo "Scanning for accidental secret patterns..."
          ! git grep -iE "(password|secret_key|private_key)\s*=\s*['\"][A-Za-z0-9+/=]{20,}['\"]" \
            -- ':!*.lock' ':!*.json' ':!*.md' ':!docs/*' ':!.env.example'
