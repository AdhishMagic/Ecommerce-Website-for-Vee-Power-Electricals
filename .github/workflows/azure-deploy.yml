name: Azure Free-Tier Deployment (SWA + App Service)

on:
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: 'Deploy Frontend to Azure Static Web Apps'
        required: true
        type: boolean
        default: true
      deploy_backend:
        description: 'Deploy Backend to Azure App Service'
        required: true
        type: boolean
        default: true

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Azure Static Web Apps (React Frontend)
  # ----------------------------------------------------------------------------
  deploy-frontend:
    name: Build & Deploy Frontend (Azure Static Web Apps)
    if: ${{ github.event.inputs.deploy_frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Frontend Production Artifacts
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
          skip_app_build: true

  # ----------------------------------------------------------------------------
  # JOB 2: Azure App Service (Django Backend)
  # ----------------------------------------------------------------------------
  deploy-backend:
    name: Package & Deploy Backend (Azure App Service)
    if: ${{ github.event.inputs.deploy_backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements/*.txt'

      - name: Install Build & Production Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/production.txt

      - name: Validate Django Production Configuration
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: "config.settings.production"
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "validation-secret-key-minimum-50-characters-length-for-check"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DATABASE_ENGINE: "django.db.backends.mysql"
          DATABASE_HOST: "127.0.0.1"
          DATABASE_PORT: "3306"
          DATABASE_NAME: "veepower_db"
          DATABASE_USER: "root"
          DATABASE_PASSWORD: "dummy"
          USE_SQLITE: "False"
        run: |
          python manage.py check --settings=config.settings.production

      - name: Collect Static Assets (WhiteNoise)
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: "config.settings.production"
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "validation-secret-key-minimum-50-characters-length-for-check"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DATABASE_ENGINE: "django.db.backends.mysql"
          DATABASE_HOST: "127.0.0.1"
          DATABASE_PORT: "3306"
          DATABASE_NAME: "veepower_db"
          DATABASE_USER: "root"
          DATABASE_PASSWORD: "dummy"
          USE_SQLITE: "False"
        run: |
          python manage.py collectstatic --noinput --settings=config.settings.production

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './backend'
